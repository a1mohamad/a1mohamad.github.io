    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");

          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decoded + location.hash
          );
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="./config.js"></script>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./styles.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        function isLandingPath() {
          var path = window.location.pathname.replace(/\/+$/, "");
          return !/(\/app(?:\/|$)|\/docs\/)/.test(path);
        }

        function addMobileLandingHeader() {
          if (!isLandingPath() || document.querySelector(".mobile-landing-shell-header")) return;
          var root = document.getElementById("root");
          if (!root) return;
          var nav = document.createElement("nav");
          nav.className = "mobile-landing-shell-header";
          nav.setAttribute("aria-label", "Mobile landing navigation");
          nav.innerHTML = '<div class="mobile-landing-shell-header__top"><a class="mobile-landing-shell-header__mark" href="./" aria-label="Lung landing"><i class="fa-solid fa-lungs"></i></a><div class="mobile-landing-shell-header__title"><strong>Lung Disease Detection</strong><span>AI Respiratory Diagnostics</span></div></div><div class="mobile-landing-shell-header__tabs"><a href="./app">App</a><a href="./docs/architecture">Architecture</a><a href="./docs/dataset">Dataset</a><a href="./docs/training">Training</a><a href="./docs/integration">API</a></div>';
          document.body.insertBefore(nav, root);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", addMobileLandingHeader, { once: true });
        } else {
          addMobileLandingHeader();
        }
      })();
    </script>
  
<script>
(function () {
  var tabs = [
    { href: "/app", label: "App", match: /\/app\/?$/ },
    { href: "/docs/architecture", label: "Architecture", match: /\/docs\/architecture\/?$/ },
    { href: "/docs/dataset", label: "Dataset", match: /\/docs\/dataset\/?$/ },
    { href: "/docs/training", label: "Training", match: /\/docs\/training\/?$/ },
    { href: "/docs/integration", label: "Integration", match: /\/docs\/integration\/?$/ }
  ];

  function isAppOrDocsPath() {
    return /\/(app|docs)(\/|$)/.test(window.location.pathname);
  }

  function ensureMobileAppTabs() {
    if (!isAppOrDocsPath()) return;
    var ribbon = document.querySelector(".top-ribbon");
    if (!ribbon || ribbon.querySelector(".mobile-app-doc-tabs")) return;

    var nav = document.createElement("nav");
    nav.className = "mobile-app-doc-tabs";
    nav.setAttribute("aria-label", "App documentation navigation");
    nav.innerHTML = tabs.map(function (item) {
      var active = item.match.test(window.location.pathname) ? " active" : "";
      return '<a class="' + active.trim() + '" href="' + item.href + '">' + item.label + '</a>';
    }).join("");

    var actions = ribbon.querySelector(".header-actions");
    if (actions) ribbon.insertBefore(nav, actions);
    else ribbon.appendChild(nav);
  }

  function boot() {
    ensureMobileAppTabs();
    var observer = new MutationObserver(ensureMobileAppTabs);
    observer.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("popstate", function () { setTimeout(ensureMobileAppTabs, 0); });
    setTimeout(ensureMobileAppTabs, 100);
    setTimeout(ensureMobileAppTabs, 450);
    setTimeout(ensureMobileAppTabs, 1000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>

  </body>
</html>
