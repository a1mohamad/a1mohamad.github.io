<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Lung Disease Detection</title>
    <meta name="description" content="Lung Disease Detection — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="Lung Disease Detection" />
    <meta property="og:description" content="Lung Disease Detection — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lung Disease Detection" />
    <meta name="twitter:description" content="Lung Disease Detection — built on Replit. Update this description to reflect the app." />
    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (part) {
              return part.replace(/~and~/g, "&");
            })
            .join("?");

          window.history.replaceState(
            null,
            null,
            location.pathname.slice(0, -1) + decoded + location.hash
          );
        }
      })(window.location);
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="./config.js"></script>
    <script type="module" crossorigin src="./app.js"></script>
    <link rel="stylesheet" crossorigin href="./styles.css">
  </head>
  <body>
    <div id="root"></div>

    <script>
      (function () {
        function isAppOrDocsPath() {
          return /\/(app|docs)(\/|$)/.test(window.location.pathname);
        }

        function isLandingPath() {
          return !isAppOrDocsPath();
        }

        function markRoute() {
          document.documentElement.classList.toggle("is-lung-app-route", isAppOrDocsPath());
        }

        function basePath() {
          var path = window.location.pathname.replace(/\/+$/, "");
          var marker = "/apps/lung-disease-detection";
          var idx = path.indexOf(marker);
          if (idx !== -1) return path.slice(0, idx + marker.length);
          return ".";
        }

        function addLandingHeader() {
          markRoute();
          if (!isLandingPath()) return;
          if (document.querySelector(".mobile-landing-shell-header")) return;
          var root = document.getElementById("root");
          if (!root) return;
          var base = basePath();
          var nav = document.createElement("nav");
          nav.className = "mobile-landing-shell-header";
          nav.setAttribute("aria-label", "Landing navigation");
          nav.innerHTML = '<div class="mobile-landing-shell-header__top"><a class="mobile-landing-shell-header__mark" href="' + base + '/" aria-label="Lung landing"><i class="fa-solid fa-lungs"></i></a><div class="mobile-landing-shell-header__title"><strong>Lung Disease Detection</strong><span>AI Respiratory Diagnostics</span></div></div><div class="mobile-landing-shell-header__tabs"><a href="' + base + '/app">App</a><a href="' + base + '/docs/architecture">Architecture</a><a href="' + base + '/docs/dataset">Dataset</a><a href="' + base + '/docs/training">Training</a><a href="' + base + '/docs/integration">API</a></div>';
          document.body.insertBefore(nav, root);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", addLandingHeader, { once: true });
        } else {
          addLandingHeader();
        }
      })();
    </script>
  
<script>
(function () {
  var tabs = [
    { path: "/app", label: "App", match: /\/app\/?$/ },
    { path: "/docs/architecture", label: "Architecture", shortLabel: "Arch", match: /\/docs\/architecture\/?$/ },
    { path: "/docs/dataset", label: "Dataset", match: /\/docs\/dataset\/?$/ },
    { path: "/docs/training", label: "Training", match: /\/docs\/training\/?$/ },
    { path: "/docs/integration", label: "Integration", shortLabel: "API", match: /\/docs\/integration\/?$/ }
  ];

  function getBasePath() {
    var path = window.location.pathname.replace(/\/+$/, "");
    var marker = "/apps/lung-disease-detection";
    var idx = path.indexOf(marker);
    if (idx !== -1) return path.slice(0, idx + marker.length);
    return "";
  }

  function isAppOrDocsPath() {
    return /\/(app|docs)(\/|$)/.test(window.location.pathname);
  }

  function markRoute() {
    document.documentElement.classList.toggle("is-lung-app-route", isAppOrDocsPath());
  }

  function ensureMobileAppTabs() {
    markRoute();
    if (!isAppOrDocsPath()) return;

    document.querySelectorAll(".mobile-app-doc-tabs").forEach(function (node, index) {
      if (index > 0) node.remove();
    });

    var ribbon = document.querySelector(".top-ribbon");
    if (!ribbon) return;

    var nav = ribbon.querySelector(".mobile-app-doc-tabs");
    if (!nav) {
      nav = document.createElement("nav");
      nav.className = "mobile-app-doc-tabs";
      nav.setAttribute("aria-label", "App documentation navigation");
    }

    var base = getBasePath();
    var pathname = window.location.pathname.replace(/\/+$/, "");
    nav.innerHTML = tabs.map(function (item) {
      var active = item.match.test(pathname) ? " active" : "";
      var text = window.matchMedia("(max-width: 760px)").matches ? (item.shortLabel || item.label) : item.label;
      return '<a class="' + active.trim() + '" href="' + base + item.path + '">' + text + '</a>';
    }).join("");

    var actions = ribbon.querySelector(".header-actions");
    if (actions && nav.parentNode !== ribbon) ribbon.insertBefore(nav, actions);
    else if (actions && nav.nextSibling !== actions) ribbon.insertBefore(nav, actions);
    else if (!actions && nav.parentNode !== ribbon) ribbon.appendChild(nav);
  }

  function boot() {
    markRoute();
    ensureMobileAppTabs();
    var observer = new MutationObserver(ensureMobileAppTabs);
    observer.observe(document.body, { childList: true, subtree: true });
    window.addEventListener("popstate", function () { setTimeout(ensureMobileAppTabs, 0); });
    window.addEventListener("resize", function () { setTimeout(ensureMobileAppTabs, 0); });
    setTimeout(ensureMobileAppTabs, 100);
    setTimeout(ensureMobileAppTabs, 450);
    setTimeout(ensureMobileAppTabs, 1000);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot, { once: true });
  else boot();
})();
</script>

  </body>
</html>
